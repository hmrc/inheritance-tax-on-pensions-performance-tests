 # Example
   # Give a name to the journey.

 journeys {

   psa-complete-Journey = {
     description = "PSA-Journey"
     load = 0.8
     parts = [Basic Details , Financial Details , Member Details , Employer Contributions , AddUnallocatedEmployer Contributions , Member Contributions , Transfer In , Transfer Out , PCLS , Surrendered Benefits , Pensions Payment , Loan Details , Borrow Details ,Report Disposal Land and Property
      ,Add SharesAndDisposalSharesDetails , Add BondAndDisposalBondDetails ,Add OtherAssetsAndDisposalAssetsDetails , PSA Declaration]
   }
   psp-complete-Journey = {
       description = "PSP-Journey"
       load = 0.8
       parts = [PSP Declaration]
   }
   # Defines a simple journey to log in and view the submissions page.
   psa-submissions-journey = {
       description = "PSA View Submissions Journey"
       load = 0.8
       parts = [ psa-view-submissions ]
   }
 }

# Specifies which of the above journeys to run.
 journeysToRun = [
     psa-complete-Journey
 ]


    # The description will appear in the test report. Use something meaningful
    #  description = "psr journey"

    #  # The load is in journeys per second. Put here the load you are going to have at the peak.
